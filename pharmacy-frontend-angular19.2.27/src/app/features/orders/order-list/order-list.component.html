<div class="page-header"><h1>Orders</h1></div>
<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="orders">
      <ng-container matColumnDef="orderNo">
        <th mat-header-cell *matHeaderCellDef>Order No.</th>
        <td mat-cell *matCellDef="let o">
          <a [routerLink]="['/sales', o.id]">{{ o.orderNo }}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef>Customer</th>
        <td mat-cell *matCellDef="let o">{{ o.customerName }}</td>
      </ng-container>
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let o">
          {{ o.orderDate | date: "mediumDate" }}
        </td>
      </ng-container>
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let o">
          {{ o.totalAmount | currency: "BDT " }}
        </td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let o">
          <span
            class="badge"
            [class.paid]="o.status === 'Paid'"
            [class.unpaid]="o.status !== 'Paid'"
            >{{ o.status }}</span
          >
        </td>
      </ng-container>
      <tr
        mat-header-row
        *matHeaderRowDef="['orderNo', 'customer', 'date', 'amount', 'status']"
      ></tr>
      <tr
        mat-row
        *matRowDef="
          let row;
          columns: ['orderNo', 'customer', 'date', 'amount', 'status']
        "
      ></tr>
    </table>
    @if (!orders.length) {
      <p class="empty">No orders found.</p>
    }
  </mat-card-content>
</mat-card>
