<div class="page-header">
    <h1>{{isEditMode ? 'Edit Warehouse' : 'New Warehouse'}}</h1>
</div>

<mat-card>
    <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Warehouse Type</mat-label>
                <mat-select formControlName="warehouseTypeId">
                    <mat-option *ngFor="let t of warehouseTypes" [value]="t.id">{{t.name}}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Address</mat-label>
                <input matInput formControlName="address">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Capacity</mat-label>
                <input matInput type="number" formControlName="capacity">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Established Date</mat-label>
                <input matInput type="date" formControlName="establishedDate">
            </mat-form-field>

            <mat-checkbox formControlName="isActive">Active</mat-checkbox>

            <div class="actions">
                <button mat-raised-button color="primary" type="submit"
                    [disabled]="form.invalid || loading">Save</button>
                <a mat-button routerLink="/warehouses">Cancel</a>
            </div>
        </form>
    </mat-card-content>
</mat-card>
