<h2 mat-dialog-title class="dialog-title">
  {{ isEdit ? "Edit Company Liability" : "Add Company Liability" }}
  <button
    mat-icon-button
    type="button"
    class="close-btn"
    (click)="close()"
    aria-label="Close"
  >
    <mat-icon>close</mat-icon>
  </button>
</h2>
<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" class="full-width"
    ><mat-label>Liability name</mat-label
    ><input
      matInput
      formControlName="name"
      placeholder="e.g. Bank Loan - City Bank"
  /></mat-form-field>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Type</mat-label>
    <mat-select formControlName="liabilityType">
      @for (t of liabilityTypes; track t.value) {
        <mat-option [value]="t.value">{{ t.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline" class="full-width"
    ><mat-label>Amount</mat-label
    ><input matInput type="number" formControlName="amount" min="0" step="0.01"
  /></mat-form-field>
  <mat-form-field appearance="outline" class="full-width"
    ><mat-label>Liability date</mat-label
    ><input matInput type="date" formControlName="liabilityDate"
  /></mat-form-field>
  <mat-form-field appearance="outline" class="full-width"
    ><mat-label>Due date (optional)</mat-label
    ><input matInput type="date" formControlName="dueDate"
  /></mat-form-field>
  <mat-form-field appearance="outline" class="full-width"
    ><mat-label>Interest rate (%)</mat-label
    ><input
      matInput
      type="number"
      formControlName="interestRate"
      min="0"
      max="100"
  /></mat-form-field>
  <mat-form-field appearance="outline" class="full-width"
    ><mat-label>Description</mat-label
    ><textarea matInput formControlName="description" rows="2"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">
    {{ isEdit ? "Save Changes" : "Add Liability" }}
  </button>
</mat-dialog-actions>
